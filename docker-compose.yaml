services:
  postgres:
    image: postgres:17
    container_name: desphub-postgres
    environment:
      POSTGRES_DB: desphub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: desphub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "user@desphub.com"
      PGADMIN_DEFAULT_PASSWORD: "postgres"
    ports:
      - "5555:80"
    depends_on:
      - postgres

volumes:
  postgres_data: